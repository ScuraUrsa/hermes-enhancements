name: test

on:
  pull_request:
    branches: [master]
    paths:
      - 'video-digest/**'
      - '.github/workflows/**'
  push:
    branches: [master]
    paths:
      - 'video-digest/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and pytest
        working-directory: video-digest
        run: pip install -e . pytest

      - name: Run tests
        working-directory: video-digest
        run: python -m pytest tests -q
