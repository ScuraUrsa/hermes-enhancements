# Builds Zed's headless agent runner (crates/eval_cli) as a static x86_64 musl binary for the
# Hermes VMs and the hbench image. Triggered by a push to this branch; bump ZED_COMMIT to rebuild.
name: zed-eval-cli

on:
  push:
    branches: [tools/zed-eval-cli-build, tools/zed-eval-cli-build-p2]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZED_COMMIT: f16f9652ec57bf806e65b2a0d51bb92a63644914
  PATCH_LEVEL: p2
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out Zed at the pinned commit
        run: |
          git init -q zed && cd zed
          git remote add origin https://github.com/zed-industries/zed.git
          git fetch -q --depth 1 origin "$ZED_COMMIT"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %cs %s'

      # Hermes patches (p1 settings quote, p2 terminal sandbox launcher + unsandboxed default);
      # see .github/zed-eval-cli/patch.py for the why.
      - uses: actions/checkout@v4
        with:
          path: hermes
      - name: Patch eval-cli
        working-directory: zed
        run: |
          python3 ../hermes/.github/zed-eval-cli/patch.py
          git diff

      - name: Install the toolchain
        working-directory: zed
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake protobuf-compiler
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          pip install -q ziglang==0.13.0
          cargo install -q --locked cargo-zigbuild@0.19.8

      - name: Build eval-cli
        working-directory: zed
        run: |
          cargo zigbuild --release --package eval_cli --target "$TARGET"
          ls -l "target/$TARGET/release/"

      - name: Package
        run: |
          mkdir out
          cp "zed/target/$TARGET/release/eval-cli" out/eval-cli
          strip out/eval-cli || true
          file out/eval-cli
          ./out/eval-cli --help | head -40
          # p2: the sandbox launcher re-exec must reach Zed's launcher, not clap
          set +e; ./out/eval-cli --zed-linux-sandbox-launcher > /tmp/launcher.txt 2>&1; rc=$?; set -e
          cat /tmp/launcher.txt
          if grep -q "unexpected argument" /tmp/launcher.txt; then echo "launcher hook missing"; exit 1; fi
          xz -9 -k out/eval-cli
          (cd out && sha256sum eval-cli eval-cli.xz | tee SHA256SUMS)
          echo "zed $ZED_COMMIT + hermes patches $PATCH_LEVEL (settings quote, terminal sandbox launcher + unsandboxed default), target $TARGET, run $GITHUB_RUN_ID" > out/BUILD_INFO

      - uses: actions/upload-artifact@v4
        with:
          name: eval-cli-${{ env.ZED_COMMIT }}-${{ env.PATCH_LEVEL }}
          path: |
            out/eval-cli.xz
            out/SHA256SUMS
            out/BUILD_INFO
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="zed-eval-cli-${ZED_COMMIT:0:7}-$PATCH_LEVEL"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; bump PATCH_LEVEL to publish a new one"; exit 0
          fi
          cat > notes.md <<EOF
          Zed's headless agent runner (crates/eval_cli) built from zed-industries/zed commit $ZED_COMMIT (GPL-3.0) by workflow run $GITHUB_RUN_ID on branch $GITHUB_REF_NAME, static $TARGET, with the Hermes patches in .github/zed-eval-cli/patch.py:
          - p1: stray quote at the end of eval-cli's agent settings template removed (every run failed with 'Failed to migrate settings: trailing characters').
          - p2: terminal tool fixed. Zed sandboxes terminal commands with bwrap by re-executing the current binary with --zed-linux-sandbox-launcher; eval-cli's main() did not handle that flag, so every command failed (exit 2) and the follow-up unsandboxed/fallback permission prompt blocked the headless run until timeout. eval-cli now calls sandbox::run_sandbox_launcher_if_invoked() and runs terminal commands unsandboxed by default (ZED_EVAL_SANDBOX=1 keeps the bwrap sandbox).

          sha256 eval-cli     $(awk '$2=="eval-cli"{print $1}' out/SHA256SUMS)
          sha256 eval-cli.xz  $(awk '$2=="eval-cli.xz"{print $1}' out/SHA256SUMS)
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "Zed eval-cli ${ZED_COMMIT:0:7} + settings and terminal fixes (static x86_64 musl)"             --notes-file notes.md out/eval-cli.xz out/SHA256SUMS out/BUILD_INFO
