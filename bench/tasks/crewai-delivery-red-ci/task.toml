repo = "ScuraUrsa/crewai-orchestrator"
fix_commit = "97f1ec5b695ca59be4a4047cc71d047b2930892f"
category = "bugfix"
difficulty = "medium"
tags = ["python", "crewai", "kanban", "private"]
hidden_tests = ["tests/test_delivery_gate_plumbing.py", "tests/test_delivery_gate.py", "tests/test_pr_merge_watch.py"]

[setup]
command = 'uv venv -q .venv && uv pip install -q --python .venv/bin/python "pytest>=8"'

[verify]
command = ".venv/bin/python -m pytest -q tests/test_delivery_gate_plumbing.py tests/test_delivery_gate.py tests/test_pr_merge_watch.py"

[agent]
timeout_sec = 1800
env_hint = "A Python environment with pytest is ready: run tests with `.venv/bin/python -m pytest`."
