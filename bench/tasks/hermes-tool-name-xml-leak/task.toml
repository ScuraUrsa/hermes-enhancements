repo = "ScuraUrsa/hermes-agent"
fix_commit = "132d6fe6d6af0d2218494e133b775f12f7bf9f53"
category = "bugfix"
difficulty = "easy"
visibility = "public"   # upstream NousResearch commit: may be in training data
tags = ["python", "hermes-agent", "public"]
hidden_tests = ["tests/run_agent/test_repair_tool_call_name.py"]

[setup]
command = 'UV_PROJECT_ENVIRONMENT=.venv uv sync -q --frozen --extra dev'
timeout_sec = 1800

[verify]
command = ".venv/bin/python -m pytest -q -p no:xdist tests/run_agent/test_repair_tool_call_name.py"

[agent]
timeout_sec = 1800
env_hint = "The project environment is installed in `.venv`: run tests with `.venv/bin/python -m pytest -q <files>` (the full suite is very large; run only the relevant files)."
