repo = "ScuraUrsa/crewai-orchestrator"
fix_commit = "7996bb3a4a9067d02c5ec3573a4808cba615b1ae"
category = "bugfix"
difficulty = "easy"
tags = ["python", "crewai", "private"]
hidden_tests = ["tests/test_delivery_gate_plumbing.py"]

[setup]
command = 'uv venv -q .venv && uv pip install -q --python .venv/bin/python "pytest>=8"'

[verify]
command = ".venv/bin/python -m pytest -q tests/test_delivery_gate_plumbing.py"

[agent]
timeout_sec = 900
env_hint = "A Python environment with pytest is ready: run tests with `.venv/bin/python -m pytest`."
