[project]
name = "hbench"
version = "0.1.0"
description = "Benchmark coding frameworks x model providers on tasks mined from the Hermes repos"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hbench = "hbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hbench", "hbench.agents"]

[tool.ruff]
line-length = 120
target-version = "py311"
