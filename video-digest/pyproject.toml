[project]
name = "ytdigest"
version = "0.1.0"
description = "Hermes: YouTube video -> transcript + visuals -> Notion report"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default]>=2025.10.0",
  "requests>=2.31",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Free CPU transcription when Groq is unavailable (Parakeet first, Whisper last).
local-asr = ["onnx-asr[cpu,hub]>=0.7", "faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
ytdigest = "ytdigest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ytdigest"]
