# ~/.hermes/ytdigest/config.yaml  (everything optional; defaults in ytdigest/config.py)
report_language: pl
# accounts processed by the backlog, in this order
accounts: [fjkazmierczak, koalamis6, kazmierczakfilipjan, praktyki]
# playlists not owned through the API (e.g. a koalamis brand channel), by URL
extra_playlists: []
#  - {account: fjkazmierczak, name: "Do obejrzenia", url: "https://www.youtube.com/playlist?list=PL..."}
skip_playlists: []
include_liked: false
# USD per day for unattended backlog work (Filip's own requests are not capped)
backlog_daily_cap_usd: 1.00
# benchmark routing table (vbench); empty = vbench/routing.json next to this folder, else built-in defaults
routing_file: ""          # install.sh: point at <repo>/vbench/routing.json
transcript_order: [manual, groq, parakeet, local, auto]
# phone notification when a one-click digest finishes (needs HASS_URL + HASS_TOKEN in env)
notify_ha_service: ""   # e.g. notify.mobile_app_sm_g780f
notion_data_source_id: 561ac2c0-89c5-4d5a-aa40-67ab0f248e9c

# Vision model tried when the routed one fails on every frame (e.g. retired, HTTP 410).
# If both fail the run is marked degraded and the report says it is transcript-only.
# vision_fallback: ollama-cloud:glm-5.3-flash

# Let Gemini watch the YouTube URL itself (paid API). Off: Ollama Cloud models do everything.
# gemini_enabled: false

# Course and documentation websites (sitedigest). Same models, transcription and idle gate as above.
site:
  notion_data_source_id: 27ebf9d7-0cae-4a91-95cd-fcca1c0547c6   # "Kursy: lekcje"; notion-setup makes a new one
  max_pages: 800                # per map run; re-run to continue
  delay_sec: [1.5, 3.5]         # pause between pages
  max_videos_per_page: 6
  max_doc_mb: 200
  report_model: null            # null = routing default; e.g. claude-code:sonnet for everything
  vision_model: null
