# Where models run, and what a token costs. Secrets are never stored here: api_key_env names the
# environment variable to read (on Hermes these come from Bitwarden Secrets Manager).
#
# billing:
#   subscription  flat fee, no per-token charge (Ollama Cloud, Claude subscription via Claude Code)
#   api           pay per token
#   local         your own hardware
# Every run records BOTH the marginal cost (0 for subscription/local) and the API-equivalent cost
# (list price for the same model on a pay-per-token API). Routing ranks by API-equivalent cost so a
# cheap route stays cheap if a subscription is ever dropped, and because subscriptions are quota-
# limited by compute, which tracks that price.

[providers.ollama-cloud]          # what Hermes already runs on (deepseek-v4-pro)
kind = "openai_compat"
base_url = "https://ollama.com/v1"
api_key_env = "OLLAMA_API_KEY"
billing = "subscription"

[providers.claude-code]           # Filip's Claude subscription, through `claude -p`
kind = "claude_code"
api_key_env = "CLAUDE_SETUP_TOKEN"  # `claude setup-token`; exported to the CLI as CLAUDE_CODE_OAUTH_TOKEN
billing = "subscription"
timeout_sec = 900

[providers.ollama-local]          # optional: Ollama on the PC
kind = "openai_compat"
base_url = "http://192.168.56.1:11434/v1"
billing = "local"

[providers.gemini]                # optional: Gemini through its OpenAI-compatible endpoint
kind = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
billing = "api"

[providers.gemini-video]          # optional baseline: Gemini watches the YouTube URL itself
kind = "gemini_video"
api_key_env = "GEMINI_API_KEY"
billing = "api"
media_resolution = "MEDIA_RESOLUTION_LOW"   # ~100 tokens/s of video instead of ~300

[providers.openrouter]
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
billing = "api"

[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
billing = "api"

[providers.groq]
kind = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
billing = "api"

[providers.anthropic]             # optional: API key instead of the subscription
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
billing = "api"

[providers.mock]
kind = "mock"
billing = "local"

# --- API-equivalent prices, USD per million tokens -----------------------------------------------
# Ollama Cloud models: cheapest reputable pay-per-token host of the same open weights, taken from
# models.dev (hermes-infra/models_dev_cache.json, 2026-10). Refresh with `vbench prices --models-dev`.
# Claude: Anthropic list prices; Claude Code also reports its own API-equivalent cost, which wins.
[prices]
"ollama-cloud:gpt-oss:20b"             = { input = 0.03,  output = 0.14, basis = "deepinfra" }
